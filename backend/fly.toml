app = "dehqonbobo-khatm-jalol"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DB_PATH = "/data/khatm.db"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"

[[mounts]]
  source = "khatm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
